name: Compilar APK Android de CAH
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construir APK depuración
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: CAH-Asistencia-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error